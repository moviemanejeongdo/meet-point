<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 애플 스페이스 블랙 / 다크 그레이 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1e27"/>
      <stop offset="100%" stop-color="#0b0c11"/>
    </linearGradient>

    <!-- 글자 프리미엄 실버-화이트 그라디언트 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- 배경 앰비언트 글로우 블러 -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- 글자 소프트 섀도우 -->
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- 블루 포인트 글로우 -->
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- iOS 정규 스쿼클 베이스 (512x512, rx 114) -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#bgGrad)"/>

  <!-- 정밀 1px 인셋 보더 (애플 글래스 피니시) -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113" ry="113" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- 배경 은은한 애플 블루 앰비언트 라이트 -->
  <circle cx="256" cy="250" r="140" fill="#2563eb" opacity="0.16" filter="url(#ambientBlur)"/>

  <!-- 메인 한글 초성 타이포그래피: ㅇ ㅈ ㄱ (정확한 ㅈ 자형) -->
  <g filter="url(#letterShadow)" fill="none" stroke="url(#textGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'ㅇ' (완벽한 기하학적 서클) -->
    <circle cx="155" cy="250" r="36"/>

    <!-- 'ㅈ' (가로선에서 꺾여 내려오는 왼쪽 획 + 오른쪽으로 뻗는 다리: 100% 명확한 'ㅈ') -->
    <path d="M 225 214 L 278 214 L 236 286"/>
    <path d="M 260 250 L 302 286"/>

    <!-- 'ㄱ' (직각과 라운드 마감의 조화) -->
    <path d="M 333 214 L 393 214 L 393 286"/>
  </g>

  <!-- 중간지점 포인트: 가운데 'ㅈ' 하단에 위치한 정밀 애플 블루 도트 -->
  <g filter="url(#blueGlow)">
    <circle cx="256" cy="336" r="6" fill="#3b82f6"/>
    <circle cx="256" cy="336" r="14" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- 미니멀 영문 서브 라벨 -->
  <text x="256" y="386" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#ffffff" 
        fill-opacity="0.38" 
        text-anchor="middle">
    MIDPOINT
  </text>
</svg>
